on:
  workflow_call:

env:
  NODE_ENV: ci

name: "Linters"

jobs:
  lint:
    name: Code Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci --ignore-scripts
      - run: npm run lint

  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci --ignore-scripts
      - uses: JulienKode/pull-request-name-linter-action@v0.5.0
